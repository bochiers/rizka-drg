services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: rizka-dental:latest
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rizka-dental.rule=Host(`${DOMAIN:-rizka.example.com}`)"
      - "traefik.http.routers.rizka-dental.entrypoints=web"
      - "traefik.http.services.rizka-dental.loadbalancer.server.port=80"
      # HTTPS: aktifkan 3 baris di bawah (dan pastikan entrypoint `websecure`
      # + certresolver `letsencrypt` ada di Traefik Dokploy) kalau cert sudah siap.
      # - "traefik.http.routers.rizka-dental-secure.rule=Host(`${DOMAIN:-rizka.example.com}`)"
      # - "traefik.http.routers.rizka-dental-secure.entrypoints=websecure"
      # - "traefik.http.routers.rizka-dental-secure.tls.certresolver=letsencrypt"
