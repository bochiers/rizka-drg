server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nuxt hashed assets (nama file berisi content hash) -> aman immutable 1 tahun
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML jangan di-cache lama supaya deploy baru langsung terlihat
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
